<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sidebar Menu</title>
    <link rel="stylesheet" href="ss.css">
</head>
<body>

    <!-- Hamburger Icon -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Sidebar Menu -->
    <nav class="sidebar" id="sidebar">
      <a href="#">Home</a>
      <div class="books-menu">
        <button id="booksToggle" class="books-toggle" aria-expanded="false">Personal Books ▾</button>
        <ul id="booksList" class="books-list" hidden>
          <!-- Populated by script.js -->
        </ul>
      </div>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    
<!-- Page Content -->


        <!-- Landing page -->
    <div class="container">
        <h1>HOPEFUL BOOK STORE</h1>
        <p>Download your books here!</p>
        <img src="img/lady.jpg" alt="error">

  <div class="search-wrapper">
  <form id="searchForm" class="search-container">
    <input type="text" id="searchInput" placeholder="Search books..." />
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </form>
</div>


    </div>
    
    <!-- Book detail modal -->
    <div id="bookModal" class="modal" hidden>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="Close">×</button>
        <h2 id="modalTitle">Book Title</h2>
        <div class="modal-body">
          <img id="modalCover" src="img/lady.jpg" alt="cover" />
          <p id="modalDesc">Description will appear here.</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
